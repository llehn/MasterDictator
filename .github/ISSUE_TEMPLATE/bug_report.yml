name: Bug report
description: Something in Master Dictator does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Say ...
  - type: input
    id: language
    attributes:
      label: Language you were dictating in
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, logs, the app you were typing into.
